apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.app.name }}
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  azureFile:
    secretName: azure-secret
    # PersistentVolumes are cluster-scoped, so the Secret reference needs
    # an explicit namespace - it defaults to "default" otherwise, which
    # doesn't match where secret.yaml actually creates azure-secret.
    secretNamespace: {{ .Values.app.namespace }}
    shareName: {{ .Values.app.pvc.share }}
    readOnly: false
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Values.app.namespace }}
spec:
  # Binds this PVC to its own same-named PV above explicitly, rather than
  # relying on capacity/accessMode matching alone to find the right one.
  volumeName: {{ .Values.app.name }}
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 5Gi
