{{- if .Values.app.basicAuthSecret }}
# app.basicAuthSecret is expected already base64-encoded (the standard
# `htpasswd -nb user pass | base64` output NGINX ingress's auth-secret
# annotation wants) - unlike azureStorage below, it isn't run through
# b64enc here.
apiVersion: v1
kind: Secret
metadata:
  name: basic-auth
  namespace: {{ .Values.app.namespace }}
data:
  auth: {{ .Values.app.basicAuthSecret }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: azure-secret
  namespace: {{ .Values.app.namespace }}
data:
  azurestorageaccountname: {{ .Values.azureStorage.accountName | b64enc }}
  azurestorageaccountkey: {{ .Values.azureStorage.accountKey | b64enc }}
