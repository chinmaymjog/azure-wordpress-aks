services:
  mysql:
    image: mysql:26.10.0
    container_name: mysql
    user: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?copy .env.example to .env and set MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=wp-base
      - MYSQL_USER=wp-user
      - MYSQL_PASSWORD=SeCret
    volumes:
      - ./tmp:/var/lib/mysql

  wordpress:
    build:
      context: .
      args:
        STATIC_ASSETS_IMAGE: ${STATIC_ASSETS_IMAGE:?set STATIC_ASSETS_IMAGE to a pinned static-assets image}
        DOCKER_BASE_IMAGE: ${DOCKER_BASE_IMAGE:?set DOCKER_BASE_IMAGE to a pinned docker-base image}
    image: wordpress-boilerplate:v1.0.0
    container_name: wordpress
    ports:
      - "80:80"
      - "443:443"
    environment:
      - WORDPRESS_DB_HOST=mysql
      - WORDPRESS_DB_NAME=wp-base
      - WORDPRESS_DB_USER=wp-user
      - WORDPRESS_DB_PASSWORD=SeCret
