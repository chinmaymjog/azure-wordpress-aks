name: Verify

on:
  push:
    branches: [advanced]
  pull_request:
    branches: [advanced]

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: helm lint
        run: helm lint charts/deploy

      - name: helm template (renders without error)
        run: helm template test charts/deploy
