name: Build & Push Images

on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
    paths:
      - 'containers/**'
      - 'charts/Dockerfile'
      - 'charts/src/**'
      - 'charts/pkg-mgr/**'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: ${{ vars.ACR_NAME }} # e.g. "crwp21551hubweu" - from `terraform output acrname` in azure-wordpress-aks-infra

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

  base-images:
    needs: tag
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: docker-base
            context: containers/docker-base
          - name: static-assets
            context: containers/static-assets
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      # az acr build both builds and pushes remotely on ACR's own build
      # service - no local Docker daemon, no registry password to manage.
      - name: Build & push ${{ matrix.name }}
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "${{ matrix.name }}:${{ needs.tag.outputs.tag }}" \
            --image "${{ matrix.name }}:latest" \
            "${{ matrix.context }}"

  site-image:
    needs: [tag, base-images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Build & push site image
        working-directory: charts
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "wordpress:${{ needs.tag.outputs.tag }}" \
            --build-arg STATIC_ASSETS_IMAGE="$ACR_NAME.azurecr.io/static-assets:${{ needs.tag.outputs.tag }}" \
            --build-arg DOCKER_BASE_IMAGE="$ACR_NAME.azurecr.io/docker-base:${{ needs.tag.outputs.tag }}" \
            .
