name: Deploy WordPress to AKS

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_REGISTRY_USER }}
  DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
  DOCKER_REGISTRY_NAME: ${{ secrets.DOCKER_REGISTRY_NAME }}
  WP_BASE_IMAGE: chinmaymjog/azure-wp-stack-docker-base:latest

jobs:
  generate_env:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.set_vars.outputs.env }}
      image_tag: ${{ steps.set_vars.outputs.image_tag }}
      app_name: ${{ steps.set_vars.outputs.app_name }}
    steps:
      - name: Determine Environment
        id: set_vars
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env=preprod" >> $GITHUB_OUTPUT
            echo "image_tag=preprod" >> $GITHUB_OUTPUT
            echo "app_name=preprod-${{ github.event.repository.name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
            echo "image_tag=latest" >> $GITHUB_OUTPUT
            echo "app_name=prod-${{ github.event.repository.name }}" >> $GITHUB_OUTPUT
          else
            echo "env=dev" >> $GITHUB_OUTPUT
            echo "image_tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "app_name=dev-${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

  build:
    needs: generate_env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build and Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_REGISTRY_NAME }}/${{ github.event.repository.name }}:${{ needs.generate_env.outputs.image_tag }}

  deploy_aks:
    needs: [generate_env, build]
    runs-on: ubuntu-latest
    environment: ${{ needs.generate_env.outputs.env }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        
      - name: Setup Helm
        uses: azure/setup-helm@v3

      - name: Deploy Placeholder
        run: |
          echo "Placeholder for Helm deploy logic matching GitLab CI"
          echo "Environment: ${{ needs.generate_env.outputs.env }}"
          echo "App Name: ${{ needs.generate_env.outputs.app_name }}"
