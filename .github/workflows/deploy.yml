name: Deploy to AKS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (from a previous Build & Push Images run)'
        required: true

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  AKS_NAME: ${{ vars.AKS_NAME }} # from `terraform output aks_name` in azure-wordpress-aks-infra
  AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }} # `terraform output aks_rg`

jobs:
  determine-env:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.set.outputs.env }}
      app_name: ${{ steps.set.outputs.app_name }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env=preprod" >> "$GITHUB_OUTPUT"
            echo "app_name=preprod-wordpress" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
            echo "app_name=prod-wordpress" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_OUTPUT"
            echo "app_name=dev-wordpress" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: determine-env
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-env.outputs.env }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      # az aks command invoke runs the command from inside the cluster's
      # control plane via the Azure API - it works even though the AKS API
      # server's authorized_ip_ranges (see azure-wordpress-aks-infra) has
      # no fixed GitHub-hosted-runner IP to allowlist, and needs no
      # kubeconfig on the runner at all.
      - name: Helm upgrade --install (${{ needs.determine-env.outputs.env }})
        run: |
          az aks command invoke \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --name "$AKS_NAME" \
            --command "helm upgrade --install ${{ needs.determine-env.outputs.app_name }} \
              --namespace ${{ needs.determine-env.outputs.app_name }} --create-namespace \
              ./charts \
              --set app.env=${{ needs.determine-env.outputs.env }} \
              --set app.name=${{ needs.determine-env.outputs.app_name }} \
              --set app.namespace=${{ needs.determine-env.outputs.app_name }} \
              --set app.image.registry=$ACR_NAME.azurecr.io \
              --set app.image.repository=wordpress \
              --set app.image.tag=${{ github.event.inputs.image_tag }} \
              --set app.pvc.share=${{ vars.PVC_FILESHARE }} \
              --set app.pvc.path=wordpress/${{ needs.determine-env.outputs.env }} \
              --set app.hosts[0].host=${{ needs.determine-env.outputs.app_name }}.${{ vars.SITE_DOMAIN }} \
              --set database.db_host=${{ vars.DB_HOST }} \
              --set database.db_name=${{ needs.determine-env.outputs.app_name }} \
              --set database.db_user=${{ vars.DB_ADMIN_USER }} \
              --set database.db_pass=${{ secrets.DB_PASSWORD }} \
              --set azureStorage.accountName=${{ vars.STORAGE_ACCOUNT_NAME }} \
              --set azureStorage.accountKey=${{ secrets.STORAGE_ACCOUNT_KEY }}" \
            --file charts
